name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-secrets-gate:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Validate required integration secrets are configured
        env:
          RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
          ZAPIER_API_KEY: ${{ secrets.ZAPIER_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          missing=0
          check_secret () {
            key="$1"
            val="$2"
            if [ -z "$val" ]; then
              echo "[MISSING] $key"
              missing=$((missing+1))
            else
              echo "[OK] $key"
            fi
          }

          check_secret "RETELL_API_KEY" "$RETELL_API_KEY"
          check_secret "ZAPIER_API_KEY" "$ZAPIER_API_KEY"
          check_secret "TWILIO_ACCOUNT_SID" "$TWILIO_ACCOUNT_SID"
          check_secret "TWILIO_AUTH_TOKEN" "$TWILIO_AUTH_TOKEN"

          if [ "$missing" -gt 0 ]; then
            echo "Integration secret validation failed with $missing missing secret(s)."
            exit 1
          fi

          echo "Integration secret validation passed."

  frontend-build:
    needs: integration-secrets-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Run frontend e2e smoke
        run: npm run test:e2e
      - name: Run lead inbox e2e smoke
        run: npx playwright test tests/leads-inbox.spec.js
      - name: Run metrics e2e smoke
        run: npx playwright test tests/metrics.spec.js
      - name: Run growth control tower e2e smoke
        run: npx playwright test tests/growth.spec.js

  backend-tests:
    needs: integration-secrets-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run migrations (SQLite smoke)
        run: python -m alembic upgrade head
      - name: Run dispatch flow integration test (fast gate)
        run: pytest -q tests/test_dispatch_flow_integration.py
      - name: Run lifecycle quick-actions test (fast gate)
        run: pytest -q tests/test_dispatch.py -k lifecycle_quick_actions_require_valid_order
      - name: Run lead conversion metrics fast gate
        run: pytest -q tests/test_reports.py -k lead_conversion_metrics_daily_series
      - name: Run collections regression fast gate
        run: pytest -q tests/test_payment_escalation.py tests/test_invoices.py
      - name: Run Python tests
        run: pytest -q

  backend-lifecycle-smoke:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run lifecycle integration smoke
        run: pytest -q tests/test_dispatch_flow_integration.py -k conflict_next_slot_then_dispatch

  backend-schedule-smoke:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Reset local SQLite file
        run: rm -f test.db
      - name: Start backend API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > uvicorn.log 2>&1 &
          sleep 3
      - name: Run schedule readiness smoke script
        run: python scripts/smoke_schedule_readiness.py

  backend-collections-smoke:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Reset local SQLite file
        run: rm -f test.db
      - name: Start backend API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > uvicorn.log 2>&1 &
          sleep 3
      - name: Run collections readiness smoke script
        run: python scripts/smoke_collections_readiness.py
