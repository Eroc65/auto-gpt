name: Deploy Render Blueprint
on:
  workflow_dispatch:
    inputs:
      render_api_key:
        description: Render API Key
        required: true
      anthropic_api_key:
        description: Anthropic API Key
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ github.event.inputs.render_api_key }}
          ANTHROPIC_API_KEY: ${{ github.event.inputs.anthropic_api_key }}
        run: python3 scripts/render_deploy.py
