name: Integration Secrets Check

on:
  workflow_dispatch:

jobs:
  validate-integration-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required integration secrets
        env:
          RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
          ZAPIER_API_KEY: ${{ secrets.ZAPIER_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          missing=0

          check_secret () {
            key="$1"
            val="$2"
            if [ -z "$val" ]; then
              echo "[MISSING] $key"
              missing=$((missing+1))
            else
              echo "[OK] $key"
            fi
          }

          check_secret "RETELL_API_KEY" "$RETELL_API_KEY"
          check_secret "ZAPIER_API_KEY" "$ZAPIER_API_KEY"
          check_secret "TWILIO_ACCOUNT_SID" "$TWILIO_ACCOUNT_SID"
          check_secret "TWILIO_AUTH_TOKEN" "$TWILIO_AUTH_TOKEN"

          if [ "$missing" -gt 0 ]; then
            echo "Integration secrets check failed with $missing missing secret(s)."
            exit 1
          fi

          echo "INTEGRATION_SECRETS_CHECK_OK"
