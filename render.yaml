services:
  - type: web
    name: oklahoma-seo-growth-engine
    runtime: node
    autoDeploy: true
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # SMS opt-in confirmation (pages/api/sms-optin.js). Without these the
      # opt-in is still recorded, but no confirmation text is sent.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Set either a Messaging Service SID or a single sending number.
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      # Post-call texts (pages/api/webhooks/retell-call-ended.js).
      # RETELL_API_KEY also verifies the webhook signature — without it every
      # webhook is rejected with 401.
      - key: RETELL_API_KEY
        sync: false
      # JSON keyed by the number that was CALLED. Only numbers listed here
      # send texts, e.g.
      # {"+16029320967":{"businessName":"GoFieldWise","ownerSms":"+14055550123"}}
      # Optional per-route: "mode":"unresolved" (owner alert only on unbooked
      # calls) and "textCaller":false.
      - key: CALL_ALERT_ROUTES
        sync: false
      - key: CALL_ALERT_TIMEZONE
        value: America/Chicago
